name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          curl -sSLf -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | shasum -a 256 -c -
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ./gitleaks version

      - name: Run Gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --log-opts="origin/${{ github.base_ref }}..HEAD" --verbose --redact
          else
            gitleaks git --verbose --redact
          fi
